appId: com.malachite.app
productName: Malachite
copyright: Copyright © 2026 Mitchell Gendron
icon: assets/icon.png
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - assets/icon.png
extraResources:
  - from: build
    to: build
    filter:
      - yt-dlp-*-source.tar.gz
      - ffmpeg/source/**/*
  - from: assets/icon.png
    to: assets/icon.png
  - from: legal/licenses.html
    to: legal/licenses.html
  - from: LEGAL.md
    to: legal/LEGAL.md
  - from: THIRD_PARTY_NOTICES.md
    to: legal/THIRD_PARTY_NOTICES.md
  - from: COMPLIANCE.md
    to: legal/COMPLIANCE.md
  - from: LICENSE
    to: legal/LICENSE
  - from: legal/yt-dlp
    to: legal/yt-dlp
  - from: legal/javascript
    to: legal/javascript
  - from: legal/ffmpeg
    to: legal/ffmpeg
  - from: LICENSE
    to: legal/ffmpeg/COPYING.GPLv3
win:
  target: nsis
  artifactName: Malachite-Setup-v${version}-windows.${ext}
  extraResources:
    - from: build/yt-dlp.exe
      to: build/yt-dlp.exe
    - from: build/ffmpeg/win32-x64
      to: build/ffmpeg/win32-x64
mac:
  target: dmg
  artifactName: Malachite-v${version}-macOS.${ext}
  category: public.app-category.utilities
  hardenedRuntime: true
  extraResources:
    - from: build/yt-dlp
      to: build/yt-dlp
    - from: build/ffmpeg/darwin-x64
      to: build/ffmpeg/darwin-x64
    - from: build/ffmpeg/darwin-arm64
      to: build/ffmpeg/darwin-arm64
dmg:
  license: LICENSE
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  license: LICENSE
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
