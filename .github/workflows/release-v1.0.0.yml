name: Release v1.0.0

on:
  workflow_dispatch:
  push:
    tags:
      - v1.0.0

concurrency:
  group: release-v1.0.0
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: v1.0.0

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            command: npm run dist:win
            artifact: malachite-windows-v1.0.0
            files: release/*.exe
          - name: macOS universal DMG
            os: macos-14
            command: npm run dist:mac
            artifact: malachite-macos-v1.0.0
            files: release/*.dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Builds remain unsigned until Apple and Microsoft signing credentials are configured.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify release version
        run: npm run release:check -- ${{ env.RELEASE_TAG }}

      - name: Run tests
        run: npm test

      - name: Build package
        run: ${{ matrix.command }}

      - name: Verify installer filename
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test -f "release/Malachite-Setup-v1.0.0-windows.exe"
          else
            test -f "release/Malachite-v1.0.0-macOS.dmg"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: malachite-*-v1.0.0
          path: release-assets
          merge-multiple: true

      - name: Create or update v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Malachite v1.0.0" \
              --generate-notes
          fi
